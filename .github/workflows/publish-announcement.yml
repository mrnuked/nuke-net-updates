name: Publish Nuke Net announcement

on:
  workflow_dispatch:
    inputs:
      message_ru:
        description: Сообщение на русском
        required: true
        type: string
      message_en:
        description: Message in English (optional)
        required: false
        type: string
      duration_hours:
        description: Сколько часов показывать сообщение
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "12"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download update repository
        uses: actions/checkout@v4

      - name: Create announcement manifest
        shell: pwsh
        env:
          MESSAGE_RU: ${{ inputs.message_ru }}
          MESSAGE_EN: ${{ inputs.message_en }}
          DURATION_HOURS: ${{ inputs.duration_hours }}
          ANNOUNCEMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $messageRu = ([string]$env:MESSAGE_RU).Trim()
          $messageEn = ([string]$env:MESSAGE_EN).Trim()
          if ($messageRu.Length -lt 1 -or $messageRu.Length -gt 500) {
            throw "The Russian message must contain from 1 to 500 characters."
          }
          if ($messageEn.Length -gt 500) {
            throw "The English message must contain no more than 500 characters."
          }

          $durationHours = [int]$env:DURATION_HOURS
          if ($durationHours -notin @(1, 3, 6, 12)) {
            throw "Unsupported announcement duration."
          }

          $startsAt = [DateTimeOffset]::UtcNow
          $manifest = [ordered]@{
            id = $env:ANNOUNCEMENT_ID
            messageRu = $messageRu
            messageEn = if ($messageEn.Length -gt 0) { $messageEn } else { $null }
            startsAt = $startsAt.ToString("O")
            expiresAt = $startsAt.AddHours($durationHours).ToString("O")
          }

          $json = $manifest | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "announcement.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false))

      - name: Publish announcement
        shell: bash
        run: |
          git config user.name "Nuke Net Announcements"
          git config user.email "actions@users.noreply.github.com"
          git add announcement.json
          git commit -m "Publish Nuke Net announcement"
          git push
